name: Daily PBL collection

on:
  schedule:
    - cron: '0 22 * * *'  # UTC 22:00 = KST 07:00
  workflow_dispatch:
    inputs:
      max:
        description: 'Max docs to process'
        default: '3'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://localhost:11434/ > /dev/null; then echo ready; break; fi
            sleep 1
          done

      - name: Pull model
        run: ollama pull gemma2:2b

      - name: Set date env
        run: echo "TODAY=$(date -u +%F)" >> $GITHUB_ENV

      - name: Run daily collection
        run: python -m pbl_bot.daily_run ${{ github.event.inputs.max || '3' }}

      - name: Generate HTML report
        run: python -m pbl_bot.report

      - name: Commit results
        run: |
          git config user.name "pbl-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/pbl.db docs/
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "daily collection $TODAY"
            git push
          fi

      - name: Check if today's report exists
        id: today_check
        run: |
          if [ -f "docs/$TODAY.html" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Send daily email
        if: steps.today_check.outputs.exists == 'true'
        continue-on-error: true   # secrets 미설정 시 무시
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: PBL Watch — ${{ env.TODAY }}
          to: ${{ secrets.EMAIL_TO }}
          from: PBL Watch <${{ secrets.EMAIL_USER }}>
          html_body: file://docs/${{ env.TODAY }}.html
