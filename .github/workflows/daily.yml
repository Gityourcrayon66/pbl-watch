name: Daily PBL collection

on:
  schedule:
    - cron: '0 21 * * *'  # UTC 21:00 = KST 06:00
  workflow_dispatch:
    inputs:
      max:
        description: 'Max docs to process'
        default: '3'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://localhost:11434/ > /dev/null; then echo ready; break; fi
            sleep 1
          done

      - name: Pull model
        run: ollama pull gemma2:2b

      - name: Run daily collection
        run: python -m pbl_bot.daily_run ${{ github.event.inputs.max || '3' }}

      - name: Commit results
        run: |
          git config user.name "pbl-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/pbl.db
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "daily collection $(date -u +%F)"
            git push
          fi
